name: 1. Validate Secrets
run-name: Validate Secrets (${{ github.ref_name }})
on: [workflow_call, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    name: Secrets
    runs-on: macos-26
    env:
      TEAMID: ${{ secrets.TEAMID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
      FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
      FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check the secrets are set and well formed
        run: |
          failed=""
          for name in TEAMID GH_PAT FASTLANE_KEY_ID FASTLANE_ISSUER_ID FASTLANE_KEY MATCH_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret is not set in this Nav2Pilot repository."
              failed=1
            fi
          done
          if [ -n "$TEAMID" ] && ! [[ "$TEAMID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::TEAMID must be the 10-character Apple team ID."
            failed=1
          fi
          if [ -n "$FASTLANE_KEY_ID" ] && ! [[ "$FASTLANE_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::FASTLANE_KEY_ID must be the 10-character key ID from App Store Connect > Users and Access > Integrations."
            failed=1
          fi
          if [ -n "$FASTLANE_KEY" ] && ! echo "$FASTLANE_KEY" | openssl pkcs8 -nocrypt > /dev/null 2>&1; then
            echo "::error::FASTLANE_KEY must be the full content of the AuthKey_*.p8 file."
            failed=1
          fi
          if [ -n "$failed" ]; then
            exit 2
          fi

      - name: Check access to the private Match-Secrets-Nav2Pilot repository
        run: |
          visibility=$(gh repo view "${{ github.repository_owner }}/Match-Secrets-Nav2Pilot" --json visibility --jq '.visibility' || true)
          if [ -z "$visibility" ]; then
            echo "::error::${{ github.repository_owner }}/Match-Secrets-Nav2Pilot is not reachable with GH_PAT. Grant GH_PAT access to this private repository."
            exit 2
          fi
          if [ "$visibility" != "PRIVATE" ]; then
            echo "::error::${{ github.repository_owner }}/Match-Secrets-Nav2Pilot must be private."
            exit 2
          fi

      - name: Install fastlane
        run: bundle install

      # Workaround for runner clock drift (https://github.com/actions/runner/issues/2996)
      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Check the App Store Connect key and MATCH_PASSWORD
        run: |
          set -o pipefail
          if ! bundle exec fastlane validate_secrets 2>&1 | tee fastlane.log; then
            if grep -q "Couldn't decrypt the repo" fastlane.log; then
              echo "::error::MATCH_PASSWORD cannot decrypt Match-Secrets-Nav2Pilot. Use the dedicated Nav2Pilot encryption password."
            elif grep -q -e "required agreement" -e "license agreement" fastlane.log; then
              echo "::error::Accept the latest Apple Developer Program License Agreement at https://developer.apple.com/account and try again."
            fi
            exit 2
          fi
