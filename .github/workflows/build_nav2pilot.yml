name: 4. Build Nav2Pilot
run-name: Build Nav2Pilot (${{ github.ref_name }})
on:
  # Manual only: builds run locally on the Mac (scripts/build-release.sh).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-nav2pilot
  cancel-in-progress: false

jobs:
  certificates:
    name: Certificates
    uses: ./.github/workflows/create_certs.yml
    secrets: inherit

  build:
    name: Build
    needs: certificates
    runs-on: macos-26
    env:
      TEAMID: ${{ secrets.TEAMID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
      FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
      FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
    steps:
      # Same Xcode as the Trio browser build.
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install fastlane
        run: bundle install

      # Keeps fastlane match from printing its summary tables in the public log.
      - name: Patch match tables
        run: |
          GEM_DIR=$(bundle exec ruby -e 'puts Gem::Specification.find_by_name("fastlane").gem_dir' || true)
          TABLE_PRINTER_PATH="$GEM_DIR/match/lib/match/table_printer.rb"
          if [ -f "$TABLE_PRINTER_PATH" ]; then
            sed -i "" "/puts(Terminal::Table.new(params))/d" "$TABLE_PRINTER_PATH"
          fi

      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Build and sign the IPA
        run: bundle exec fastlane build_nav2pilot

      - name: Upload to TestFlight
        run: bundle exec fastlane release

      - name: Upload build log and IPA
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nav2pilot-build
          path: |
            artifacts
            buildlog
          if-no-files-found: ignore
