name: 3. Create Certificates
run-name: Create Certificates (${{ github.ref_name }})
on: [workflow_call, workflow_dispatch]

permissions:
  contents: read

# Uses the distribution certificate already in Match-Secrets (shared with Trio) and creates the
# App Store profiles of the two Nav2Pilot identifiers. Certificate renewal (nuke) is left to the Trio
# workflow on purpose: revoking certificates here would also affect Trio.
jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit

  certificates:
    name: Certificates
    needs: validate
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install fastlane
        run: bundle install

      # Keeps fastlane match from printing its summary tables in the public log.
      - name: Patch match tables
        run: |
          GEM_DIR=$(bundle exec ruby -e 'puts Gem::Specification.find_by_name("fastlane").gem_dir' || true)
          TABLE_PRINTER_PATH="$GEM_DIR/match/lib/match/table_printer.rb"
          if [ -f "$TABLE_PRINTER_PATH" ]; then
            sed -i "" "/puts(Terminal::Table.new(params))/d" "$TABLE_PRINTER_PATH"
          fi

      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Certificates and profiles
        run: bundle exec fastlane certs
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
